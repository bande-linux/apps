[package]
name = "bande-template"
description = "Bande Template: a starting point for a Bande app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
tracing.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-l10n.workspace = true
bande-toolkit.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "misc"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
extended-description = """\
A starting point for a Bande app: one window that says hello, with the \
menus, keys and single instance every Bande app has."""
assets = [
    ["target/release/bande-template", "usr/bin/", "755"],
    ["data/org.bande.Template.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Template.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Template.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
