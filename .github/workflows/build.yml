name: build
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || inputs.tag && format('Dry run of {0}', inputs.tag) || format('Test build of {0}', inputs.apps) }}"

on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Dry-run this release tag (<app>-vX.Y.Z) on this commit, built exactly as its push would be (never published)
        default: ''
      apps:
        description: Without a tag, apps to test-build, by directory name, space-separated, or "all" (never published)
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the apps to build
        id: apps
        env:
          NAMES: ${{ inputs.apps }}
        run: |
          apps=$(ci/changed-apps.sh "$RELEASE_TAG" "$NAMES")
          echo "Building: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  app:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    name: ${{ matrix.app }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:testing
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the toolchain and packages
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          ci/setup.sh install "${{ matrix.app }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and check
        run: ci/build-app.sh "${{ matrix.app }}" out
      - name: Install and smoke-test
        run: ci/smoke.sh --install out/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.app }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  debs:
    needs: app
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: app-*-${{ matrix.arch }}
          path: debs
          merge-multiple: true
      - run: ls -l debs
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error
