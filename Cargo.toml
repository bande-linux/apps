[workspace]
resolver = "3"
members = ["apps/*", "libs/*", "template"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/apps"

[workspace.dependencies]
accesskit = "=0.25.2"
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "=0.22.1"
data-encoding = "2.11"
encoding_rs = "=0.8.44"
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
flate2 = "=1.1.10"
hayro = "=0.8.0"
html5ever = "0.40"
httparse = "=1.10.1"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
jiff = "=0.2.38"
jxl-oxide = { version = "=0.12.6", default-features = false }
kamadak-exif = "=0.6.1"
mailparse = "0.18"
native-tls = "0.2.18"
resvg = { version = "=0.49.0", default-features = false }
regex = "=1.13.1"
roxmltree = "=0.21.2"
rusqlite = "0.41"
rustix = "=1.1.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = { version = "=0.11.1", default-features = false }
tempfile = "=3.27.0"
tracing = "=0.1.44"
ureq = { version = "=3.5.0", features = ["platform-verifier"] }
zbus = "=5.19.0"
zeroize = "=1.8.1"
bande-keyring = { path = "libs/keyring" }
bande-vm = { path = "libs/vm" }
bande-app = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-app-menu = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-app-settings = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-datetime = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-design = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-fs = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-inbox = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-notify = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-packages = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-sound = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e", default-features = false }
bande-search = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-spring = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-status = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-thumbnails = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-watch = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-volumes = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "4c52920e8a98d06ac74cc69d890b14fda7da938e" }
web-content = { git = "https://github.com/bande-linux/web", rev = "dd2cad638f1695896c0d87e27c4d982b06daffbf" }
web-net = { git = "https://github.com/bande-linux/web", rev = "dd2cad638f1695896c0d87e27c4d982b06daffbf" }
web-paint = { git = "https://github.com/bande-linux/web", rev = "dd2cad638f1695896c0d87e27c4d982b06daffbf" }


[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
