[package]
name = "bande-browser"
description = "Bande Browser: a web browser on Bande's own web engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
rustix = { workspace = true, features = ["event"] }
tracing.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-l10n.workspace = true
bande-toolkit.workspace = true
web-content.workspace = true
web-net.workspace = true
web-paint.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "web"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
extended-description = """\
A web browser built on Bande's own web engine, written from scratch in \
Rust: private by default, no telemetry, no ads."""
assets = [
    ["target/release/bande-browser", "usr/bin/", "755"],
    ["data/org.bande.Browser.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Browser.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Browser.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
