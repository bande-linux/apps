[package]
name = "bande-terminal"
description = "Bande terminal: a PTY terminal on the Bande toolkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/apps"
publish = false

[dependencies]
accesskit = "=0.25.2"
alacritty_terminal = { version = "=0.26.0", default-features = false }
tracing = "=0.1.44"
zbus = "=5.19.0"
bande-app-menu = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-app-settings = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-design = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-log = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-notify = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-spring = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[dev-dependencies]
tempfile = "=3.27.0"
bande-golden = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "misc"
depends = "$auto, fonts-jetbrains-mono, fonts-inter, fonts-manrope"
extended-description = """\
The terminal of the Bande desktop: xterm-compatible emulation with \
10,000 lines of scrollback, Shift+Ctrl+C and Shift+Ctrl+V for the clipboard so \
that Control+C stays the interrupt, and the system's light or dark \
appearance."""
assets = [
    ["target/release/bande-terminal", "usr/bin/", "755"],
    ["data/org.bande.Terminal.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Terminal.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Terminal.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
