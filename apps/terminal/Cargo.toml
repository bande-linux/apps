[package]
name = "bande-terminal"
description = "Bande terminal: a PTY terminal on the Bande toolkit"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
alacritty_terminal.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["event"] }
zbus.workspace = true
bande-app-menu.workspace = true
bande-app-settings.workspace = true
bande-design.workspace = true
bande-l10n.workspace = true
bande-notify.workspace = true
bande-sound.workspace = true
bande-spring.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "misc"
depends = "$auto, fonts-jetbrains-mono, fonts-inter, fonts-manrope"
provides = "x-terminal-emulator"
maintainer-scripts = "debian/"
extended-description = """\
The terminal of the Bande desktop: xterm-compatible emulation with \
10,000 lines of scrollback, Shift+Ctrl+C and Shift+Ctrl+V for the clipboard so \
that Control+C stays the interrupt, and the system's light or dark \
appearance."""
assets = [
    ["target/release/bande-terminal", "usr/bin/", "755"],
    ["data/org.bande.Terminal.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Terminal.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Terminal.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
