[package]
name = "bande-monitor"
description = "Bande Activity Monitor: CPU, memory, disk and network use per app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/apps"
publish = false

[dependencies]
accesskit = "=0.25.2"
rustix = { version = "=1.1.6", features = ["event", "param", "process"] }
tracing = "=0.1.44"
zbus = "=5.19.0"
bande-app = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-app-menu = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-log = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-status = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[dev-dependencies]
tempfile = "=3.27.0"
bande-golden = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-test-bus = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "misc"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
extended-description = """\
The activity monitor of the Bande desktop: lists running apps with their \
processes and shows CPU, memory, disk and network use, and quits or force \
quits any app."""
assets = [
    ["target/release/bande-monitor", "usr/bin/", "755"],
    ["data/org.bande.ActivityMonitor.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.ActivityMonitor.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.ActivityMonitor.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
