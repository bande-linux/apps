[package]
name = "bande-software"
description = "Bande Software: browse, search and install apps from Debian and Flathub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/apps"
publish = false

[dependencies]
accesskit = "=0.25.2"
flate2 = "=1.1.10"
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml_ng = "=0.10.0"
tracing = "=0.1.44"
zbus = "=5.19.0"
bande-inbox = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-log = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-packages = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-search = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }

[dev-dependencies]
tempfile = "=3.27.0"
bande-golden = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }
bande-test-bus = { git = "https://github.com/bande-linux/desktop", rev = "97b1ba89cb1beef2337a83920cc9f1f1e8ca564d" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "admin"
depends = "$auto, appstream, packagekit, fonts-inter"
recommends = "bande-polkit"
extended-description = """\
The app store of the Bande desktop: browse and search the apps Debian and \
Flathub describe with AppStream, read about them before installing, and \
hide apps that need X11, which Bande does not run."""
assets = [
    ["target/release/bande-software", "usr/bin/", "755"],
    ["data/org.bande.Software.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Software.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/org.bande.Software.metainfo.xml", "usr/share/metainfo/", "644"],
]
