[package]
name = "bande-software"
description = "Bande Software: browse, search and install apps from Debian"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
bande-app-settings.workspace = true
bande-app-menu.workspace = true
bande-datetime.workspace = true
bande-fs.workspace = true
flate2.workspace = true
image.workspace = true
jiff.workspace = true
jxl-oxide.workspace = true
rustls.workspace = true
ureq.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tracing.workspace = true
zbus.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-notify.workspace = true
bande-packages.workspace = true
bande-search.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "admin"
depends = "$auto, appstream, packagekit, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-polkit"
extended-description = """\
The app store of the Bande desktop: browse and search the apps Debian \
describes with AppStream, read about them before installing, and hide apps \
that need X11, which Bande does not run. With flatpak installed, it offers \
Flathub's apps too."""
assets = [
    ["target/release/bande-software", "usr/bin/", "755"],
    ["data/org.bande.Software.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Software.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/org.bande.Software.metainfo.xml", "usr/share/metainfo/", "644"],
]
