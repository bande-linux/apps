[package]
name = "bande-calendar"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Bande Calendar: CalDAV, local and subscribed calendars"
publish = false

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
base64.workspace = true
jiff.workspace = true
roxmltree.workspace = true
rustix = { workspace = true, features = ["fs", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rustls.workspace = true
ureq.workspace = true
zbus.workspace = true
bande-keyring.workspace = true
bande-app-menu.workspace = true
bande-app-settings.workspace = true
bande-design.workspace = true
bande-datetime.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "utils"
priority = "optional"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-secrets | org.freedesktop.secrets"
extended-description = """\
The calendar of the Bande desktop: CalDAV accounts with offline sync, a local \
calendar and read-only subscriptions, with day, week, month and year views and \
event alerts."""
assets = [
    ["target/release/bande-calendar", "usr/bin/", "755"],
    ["data/org.bande.Calendar.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.CalendarAgent.desktop", "etc/xdg/autostart/", "644"],
    ["data/org.bande.Calendar.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Calendar.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
