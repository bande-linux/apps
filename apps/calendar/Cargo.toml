[package]
name = "bande-calendar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bande Calendar: CalDAV, local and subscribed calendars"
publish = false

[dependencies]
accesskit = "=0.25.2"
base64 = "=0.22.1"
jiff = "=0.2.38"
roxmltree = "=0.21.2"
rustix = { version = "=1.1.6", features = ["event", "pipe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
ureq = { version = "=3.5.0", features = ["platform-verifier"] }
zbus = "=5.19.0"
bande-app-menu = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-design = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-datetime = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-log = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }

[dev-dependencies]
tempfile = "=3.27.0"
bande-golden = { git = "https://github.com/bande-linux/desktop", rev = "0bfd8078409ab3237bbe0314fdf3602ea0773af0" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "utils"
priority = "optional"
depends = "$auto, fonts-inter, fonts-manrope"
extended-description = """\
The calendar of the Bande desktop: CalDAV accounts with offline sync, a local \
calendar and read-only subscriptions, with day, week, month and year views and \
event alerts."""
assets = [
    ["target/release/bande-calendar", "usr/bin/", "755"],
    ["data/org.bande.Calendar.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Calendar.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
