[package]
name = "bande-calculator"
description = "Bande Calculator: basic, scientific and programmer calculations with a paper tape"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
tracing.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-l10n.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "misc"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
extended-description = """\
The calculator of the Bande desktop: Basic, Scientific and Programmer modes \
with exact decimal arithmetic, operator precedence, degrees and radians, \
hexadecimal, octal and binary with bitwise operations and word sizes, \
Reverse Polish Notation and a paper tape."""
assets = [
    ["target/release/bande-calculator", "usr/bin/", "755"],
    ["data/org.bande.Calculator.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Calculator.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Calculator.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
