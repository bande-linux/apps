[package]
name = "bande-mail"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Mail for the Bande desktop"
publish = false

[dependencies]
accesskit = "=0.25.2"
data-encoding = "2.11"
html5ever = "0.40"
jiff = "=0.2.38"
mailparse = "0.18"
native-tls = "0.2.18"
roxmltree = "=0.21.2"
rusqlite = "0.41"
rustix = { version = "=1.1.6", features = ["event", "pipe"] }
tracing = "=0.1.44"
unbound-app-menu = { path = "/home/mikael/unbound-linux/repos/desktop/crates/libs/app-menu" }
unbound-l10n = { path = "/home/mikael/unbound-linux/repos/desktop/crates/libs/l10n" }
unbound-log = { path = "/home/mikael/unbound-linux/repos/desktop/crates/libs/log" }
unbound-notify = { path = "/home/mikael/unbound-linux/repos/desktop/crates/services/notify" }
unbound-toolkit = { path = "/home/mikael/unbound-linux/repos/desktop/crates/toolkit/toolkit" }
unbound-xdg = { path = "/home/mikael/unbound-linux/repos/desktop/crates/libs/xdg" }
zbus = "=5.19.0"

[dev-dependencies]
tempfile = "=3.27.0"
unbound-golden = { path = "/home/mikael/unbound-linux/repos/desktop/crates/testing/golden" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "mail"
priority = "optional"
depends = "$auto, fonts-inter"
recommends = "gnome-keyring"
extended-description = """\
Mail for the Bande desktop, in three panes as in macOS Mail: mailboxes \
and a unified Inbox, the message list, and the reader. It speaks IMAP and \
SMTP over TLS, keeps an offline copy of every account, follows new mail \
with IMAP IDLE and keeps passwords in the Secret Service."""
assets = [
    ["target/release/bande-mail", "usr/bin/", "755"],
    ["data/org.bande.Mail.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Mail.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
