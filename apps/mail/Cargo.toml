[package]
name = "bande-mail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Mail for the Bande desktop"
publish = false

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-fs.workspace = true
bande-l10n.workspace = true
bande-notify.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true
data-encoding.workspace = true
html5ever.workspace = true
image.workspace = true
jiff.workspace = true
mailparse.workspace = true
native-tls.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
tracing.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["process"] }
tempfile.workspace = true
bande-golden.workspace = true
bande-test-bus.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "mail"
priority = "optional"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "gnome-keyring"
extended-description = """\
Mail for the Bande desktop, in three panes as in macOS Mail: mailboxes \
and a unified Inbox, the message list, and the reader. It speaks IMAP and \
SMTP over TLS, keeps an offline copy of every account, follows new mail \
with IMAP IDLE and keeps passwords in the Secret Service."""
assets = [
    ["target/release/bande-mail", "usr/bin/", "755"],
    ["data/org.bande.Mail.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Mail.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Mail.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
