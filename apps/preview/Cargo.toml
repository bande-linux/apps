[package]
name = "bande-preview"
description = "Bande Preview: views images and PDF documents"
version = "0.1.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
bande-volumes.workspace = true
serde.workspace = true
accesskit.workspace = true
image = { workspace = true, features = ["webp"] }
tracing.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-content.workspace = true
bande-fs.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-thumbnails.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "graphics"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-files"
extended-description = """\
The image and PDF viewer of the Bande desktop: opens photos and pictures \
from Files, zooms, rotates and flips them, steps through a folder, plays \
animations and slideshows, copies them and shows their size, dimensions \
and camera details. PDF documents scroll continuously with page \
thumbnails and their table of contents; their text can be selected, \
copied and searched, and locked documents open with their password."""
assets = [
    ["target/release/bande-preview", "usr/bin/", "755"],
    ["data/org.bande.Preview.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Preview.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Preview.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/release/l10n/development/bande-preview/*", "usr/share/bande/l10n/bande-preview/", "644"],
]
