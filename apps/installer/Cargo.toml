[package]
name = "bande-installer"
description = "Bande Package Installer: installs and removes .deb files through PackageKit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/apps"
publish = false

[dependencies]
accesskit = "=0.25.2"
tracing = "=0.1.44"
zbus = "=5.19.0"
bande-fs = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-l10n = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-log = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-packages = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-toolkit = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-xdg = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[dev-dependencies]
tempfile = "=3.27.0"
bande-golden = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }
bande-test-bus = { git = "https://github.com/bande-linux/desktop", rev = "49ab65b01b58d5d86278beb5d9bc9abd7e97dd86" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
copyright = "2026 Mikael Hug"
section = "admin"
depends = "$auto, packagekit, fonts-inter"
recommends = "bande-polkit"
extended-description = """\
The package installer of the Bande desktop: opens .deb files from Files or \
a browser, checks that they fit this computer, shows what else they install \
or remove, and installs, upgrades or removes them through PackageKit, \
asking for an administrator password."""
assets = [
    ["target/release/bande-installer", "usr/bin/", "755"],
    ["data/org.bande.Installer.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Installer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
